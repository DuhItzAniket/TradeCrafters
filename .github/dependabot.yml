version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      compatible-development-updates:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
# Legacy lockfiles remain visible to security alerts. Updating/replacing the old
# CRA/Express application is a separate task; it is not deployed by this workspace.

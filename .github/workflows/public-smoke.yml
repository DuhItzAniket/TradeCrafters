name: Hosted public smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: read
concurrency:
  group: hosted-public-smoke
  cancel-in-progress: false
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Probe liveness, rendered policy, DB reads and anonymous denial
        run: node scripts/public-smoke.mjs

name: Global foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run verify:source
      - run: npm ci
      - run: npm run setup:local
      - run: docker compose --env-file .env.local up -d --wait
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:migrate
      - run: npm run setup:db-identities
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Verify HTTP, auth and MySQL integration
        run: |
          mkdir -p .local
          npm run dev > .local/dev.log 2>&1 &
          node scripts/wait-for-server.mjs
          npm run test:integration
      - name: Stop isolated database
        if: always()
        run: docker compose --env-file .env.local down
